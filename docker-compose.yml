version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: video-streaming-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: video_streaming
      MYSQL_USER: developer
      MYSQL_PASSWORD: developerpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prm"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video-streaming-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console Web UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local
  minio-data:
    driver: local