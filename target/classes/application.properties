# ----------------------------------------
# SERVER CONFIGURATION
# ----------------------------------------
server.port=8086
server.servlet.context-path=/

# ----------------------------------------
# DATABASE (MySQL) CONFIGURATION
# ----------------------------------------
spring.application.name=Video-Streaming
spring.datasource.url=jdbc:mysql://localhost:3307/video_streaming?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=developer
spring.datasource.password=developerpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# HIBERNATE & JPA CONFIGURATION
# ----------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----------------------------------------
# MULTIPART CONFIGURATION (Optional for small assets like thumbnails)
# ----------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ----------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------
logging.level.root=INFO
logging.level.com.example.videostreaming=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ----------------------------------------
# MINIO CONFIGURATION
# ----------------------------------------
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadminpassword
minio.bucket-name=video-streaming